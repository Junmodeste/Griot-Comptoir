[project]
name = "griot-comptoir"
version = "0.1.0"
description = "Agent that turns handwritten shop ledgers into verified stock, sales and debt records synced to Odoo."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pillow>=10",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
griot = ["review.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Meta Model API (needs MODEL_API_KEY)",
    "odoo: writes to a real Odoo database (needs ODOO_URL, ODOO_DB, ODOO_USER, ODOO_API_KEY)",
]
